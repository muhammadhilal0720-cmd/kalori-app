<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalori Fun</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F1EEFF">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#F1EEFF;--cd:#fff;--ink:#1F1B3A;--mut:#5A5675;--soft:#ECE8FF;--bb:#1F1B3A;--bf:#fff;--lk:#5B3FD6;--gr:#2FBF71;--gf:#9BE7BC;--yf:#FFE08A;--on:#1F1B3A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122B;--cd:#221F3F;--ink:#F3F1FF;--mut:#B6B1D6;--soft:#34305A;--bb:#F3F1FF;--bf:#1F1B3A;--lk:#B9A8FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122B;--cd:#221F3F;--ink:#F3F1FF;--mut:#B6B1D6;--soft:#34305A;--bb:#F3F1FF;--bf:#1F1B3A;--lk:#B9A8FF;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 15px Nunito,system-ui,sans-serif}
.w{max-width:480px;margin:0 auto;padding:0 20px 130px;display:flex;flex-direction:column;gap:12px}
h1,h2,.t{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
h1{font-size:26px;line-height:1.1}h2{font-size:18px}
.sub{font-size:13px;color:var(--mut);font-weight:700}
.c{background:var(--cd);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rw{display:flex;align-items:center;gap:12px}
.hd{display:flex;align-items:center;gap:8px;padding-top:18px;justify-content:space-between}
.hd.l{justify-content:flex-start}
button{font:inherit;color:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.hd .ic{background:var(--cd)}
.btn{min-height:50px;border:0;border-radius:25px;padding:0 18px;background:var(--cd);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;text-decoration:none;color:var(--ink)}
.pri{background:var(--gr);color:var(--on)}
.dk{background:var(--bb);color:var(--bf)}
.lk{background:none;border:0;min-height:44px;color:var(--lk);font-weight:800}
.nt{font-size:12px;color:var(--mut);text-align:center;margin:0}
.dl{text-align:center;font-size:11px;font-weight:800;color:var(--mut)}
.dn{width:32px;height:32px;margin:4px auto 0;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px}
.dn.ok{background:var(--gr);color:var(--on)}
.dn.tn{box-shadow:inset 0 0 0 3px var(--ink)}
.r{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
.r>span:first-child{width:54px}
.r>span:last-child{min-width:84px;text-align:right}
.b{flex:1;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.b>div{height:100%;border-radius:7px}
.m{flex:1;background:var(--cd);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px}
.tg{align-self:flex-start;background:var(--yf);color:var(--on);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:800}
.bt{min-height:44px;border:0;border-radius:14px;background:var(--bb);color:var(--bf);font-weight:800;font-size:14px}
.er+.er{border-top:2px solid var(--soft);padding-top:10px}
.ph{height:210px;border-radius:24px;background:#CFEFD9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;color:#1F1B3A}
.ph img{width:100%;height:100%;object-fit:cover}
.ch{min-height:44px;border:0;border-radius:22px;padding:0 16px;background:var(--cd);font-weight:800}
.ch.on{background:var(--bb);color:var(--bf)}
.mc{background:rgba(127,127,127,.28);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800}
.wk,.gr{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center}
.wk{font-size:12px;font-weight:800;color:var(--mut)}
.gr{gap:4px 0}
.k{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-weight:800;font-size:14px;color:var(--ink)}
.k.g{background:var(--gf);color:var(--on)}.k.y{background:var(--yf);color:var(--on)}.k.f{color:var(--mut)}
.k.tn{background:var(--bb);color:var(--bf)}.k.sl{outline:3px solid var(--ink);outline-offset:1px}
.lg{display:flex;justify-content:space-around;font-size:12px;font-weight:800;gap:4px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.in{display:flex;align-items:center;gap:8px}
.in span{flex:1}
.in input{width:96px;min-height:44px;border-radius:14px;border:2px solid var(--soft);background:var(--bg);color:var(--ink);font:800 16px Nunito,sans-serif;padding:0 10px;text-align:right}
.in.nm input{width:180px;text-align:left}
.in i{width:36px;font-style:normal;color:var(--mut);font-size:13px}
textarea{width:100%;min-height:76px;border-radius:14px;border:2px solid var(--soft);background:var(--bg);color:var(--ink);font:600 12px monospace;padding:8px}
.bd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800}
.bd i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 20px Fredoka,Nunito,sans-serif;background:var(--soft);color:var(--mut)}
.bd i.e{background:var(--yf);color:var(--on)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:var(--cd);border-radius:28px 28px 0 0;padding:8px 6px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;background:none;border:0;padding:0 0 6px;font-size:11px;font-weight:800;color:var(--mut);min-width:58px;min-height:52px;border-radius:18px}
.nv.on{background:var(--soft);color:var(--ink)}
.fab{width:60px;height:60px;margin-top:-34px;border-radius:50%;background:#FF6B57;color:var(--on);border:4px solid var(--cd);display:flex;align-items:center;justify-content:center}
.nv:has(.fab){color:var(--ink)}
#ts{max-width:90%;text-align:center;position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bb);color:var(--bf);padding:10px 16px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:800;z-index:9}
#ts.on{opacity:1}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div id="ts" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const K='kalori-fun-v1';
const WORKER='https://kalori-me.muhammadhilal0720.workers.dev';
let S={e:[],t:{k:1900,p:90,c:220,f:60},u:{n:'',w:'',h:'',a:''}};
try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);S={e:o.e||[],t:Object.assign(S.t,o.t),u:Object.assign(S.u,o.u)}}}catch(x){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],DN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fm=n=>Math.round(n).toLocaleString('id-ID');
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dk(new Date());
const parse=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sm=(l,k)=>l.reduce((a,x)=>a+x[k],0);
const day=d=>{const l=S.e.filter(x=>x.d===d);return{l,k:sm(l,'k'),p:sm(l,'p'),c:sm(l,'c'),f:sm(l,'f')}};
function streak(){const ds=new Set(S.e.map(x=>x.d));let d=new Date(),n=0;if(!ds.has(dk(d)))d.setDate(d.getDate()-1);while(ds.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function best(){const a=[...new Set(S.e.map(x=>x.d))].sort();let b=0,c=0,p=null;for(const s of a){const t=parse(s);c=p&&Math.round((t-p)/864e5)===1?c+1:1;p=t;b=Math.max(b,c)}return b}
const I=p=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const IH=I('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),IC=I('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>'),ICM=I('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>'),IM=I('<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>'),IU=I('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'),BK=I('<path d="M15 5l-7 7 7 7"/>'),NX=I('<path d="M9 5l7 7-7 7"/>'),TR=I('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>');
const CHK='<svg class="i" style="width:16px;height:16px;stroke-width:3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const FL='<svg width="28" height="28" viewBox="0 0 24 24" fill="#1F1B3A" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 2 3 0z"/></svg>';
const AV=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" role="img" aria-label="Maskot alpukat"><ellipse cx="32" cy="34" rx="22" ry="27" fill="#2FBF71"/><ellipse cx="32" cy="36" rx="16" ry="21" fill="#D9F7A6"/><circle cx="32" cy="47" r="7" fill="#A5693C"/><circle cx="25" cy="29" r="2.5" fill="#1F1B3A"/><circle cx="39" cy="29" r="2.5" fill="#1F1B3A"/><path d="M26 35q6 5 12 0" stroke="#1F1B3A" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
const PL='<svg width="110" height="110" viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="78" fill="#fff"/><circle cx="85" cy="85" r="58" fill="#F1EEFF"/><ellipse cx="68" cy="88" rx="26" ry="20" fill="#FFF5DA"/><ellipse cx="104" cy="72" rx="22" ry="16" fill="#E58A3B"/><ellipse cx="100" cy="106" rx="20" ry="12" fill="#5CC27E"/></svg>';
const M=[{n:'Nasi merah, ayam bakar, lalapan',m:'Siang',k:520,p:38,c:62,f:12},{n:'Pisang dan yogurt tawar',m:'Camilan',k:180,p:8,c:32,f:3},{n:'Oatmeal, telur rebus, apel',m:'Pagi',k:350,p:18,c:48,f:10},{n:'Gado-gado tanpa lontong',m:'Malam',k:380,p:16,c:34,f:20},{n:'Tempe bakar, sayur bening, nasi',m:'Malam',k:450,p:22,c:58,f:13},{n:'Telur dadar dan tumis kangkung',m:'Siang',k:400,p:20,c:20,f:26}];
const FD={nasi:['Nasi putih',130,2.7,28,.3],ayam:['Ayam bakar',210,27,0,11],lal:['Lalapan dan sambal',40,1.8,7,.8],telur:['Telur dadar',190,12,1,15],tempe:['Tempe goreng',330,19,12,25],gado:['Gado-gado',130,6,12,7],mie:['Mie goreng',190,5,28,6]};
const SC=[[['nasi',150],['ayam',90],['lal',60]],[['nasi',150],['telur',60],['tempe',40]],[['gado',250]],[['mie',200],['telur',50]]];
const nu=it=>{const r=it.g/100;return{n:it.n,k:it.r[0]*r,p:it.r[1]*r,c:it.r[2]*r,f:it.r[3]*r}};
const bar=(l,v,m,c,u)=>`<div class="r"><span>${l}</span><div class="b"><div style="width:${Math.min(100,v/m*100)}%;background:${c}"></div></div><span>${fm(v)}/${fm(m)}${u}</span></div>`;
const bars=d=>bar('Kalori',d.k,S.t.k,'#FF6B57','')+bar('Protein',d.p,S.t.p,'#4C8DFF',' g')+bar('Karbo',d.c,S.t.c,'#FFC93C',' g')+bar('Lemak',d.f,S.t.f,'#FF8A1F',' g');
const list=l=>l.length?l.map(e=>`<div class="rw er"><div style="flex:1"><div>${esc(e.n)}</div><div class="sub">${e.m} · ${e.g?e.g+' g':'1 porsi'}</div></div><b class="t">${fm(e.k)} kkal</b><button class="ic" data-a="del" data-id="${e.id}" aria-label="Hapus ${esc(e.n)}">${TR}</button></div>`).join(''):'<div class="sub">Belum ada catatan.</div>';
const NV=a=>'<div class="nav">'+[['home','Beranda',IH],['cal','Kalender',IC],['scan','Scan',ICM],['menu','Menu',IM],['prof','Profil',IU]].map(([v,l,ic])=>v==='scan'?`<button class="nv" data-a="nav" data-v="scan"><span class="fab">${ic}</span>Scan</button>`:`<button class="nv${a===v?' on':''}" data-a="nav" data-v="${v}"${a===v?' aria-current="page"':''}>${ic}${l}</button>`).join('')+'</div>';
let V='home',sg=0,sc={img:null,busy:false,it:[],meal:'Siang'};
let mn={meal:'Siang'};
const n0=new Date();let cs={y:n0.getFullYear(),m:n0.getMonth(),sel:today()};
const defMeal=()=>{const h=new Date().getHours();return h<10?'Pagi':h<15?'Siang':h<18?'Camilan':'Malam'};
const shrink=(u,mx=1024)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const z=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};im.onerror=no;im.src=u});
async function analyze(){sc.busy=true;render();
try{const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:await shrink(sc.img),mime:'image/jpeg'})});const d=await r.json();
if(!r.ok||d.error){sc.busy=false;render();toast(d.status===429?'Kuota gratis habis, coba lagi nanti':'Error AI: '+(d.detail||d.error||'tidak diketahui'),7000);return}
if(!Array.isArray(d.items)||!d.items.length){sc.busy=false;render();toast('Makanan tidak terdeteksi, coba foto lain');return}
sc.it=d.items.slice(0,8).map(x=>{const g=Math.max(10,Math.round(+x.grams)||100),q=100/g;return{n:String(x.name||'Makanan').slice(0,40),g,r:[(+x.kcal||0)*q,(+x.protein||0)*q,(+x.carbs||0)*q,(+x.fat||0)*q]}});
sc.mock=false;sc.cf=d.source==='cloudflare';sc.meal=defMeal();sc.busy=false;V='res';render()}
catch(x){sc.busy=false;render();toast('Tidak bisa terhubung ke AI. Cek koneksi.')}}
function home(){const t=today(),d=day(t),T=S.t,st=streak(),n=new Date(),dw=(n.getDay()+6)%7,ds=new Set(S.e.map(x=>x.d));
let wk='';['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach((l,i)=>{const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dw+i),k=dk(x),ok=ds.has(k);wk+=`<div class="dl">${l}<div class="dn${ok?' ok':''}${k===t?' tn':''}">${ok?CHK:(k===t?x.getDate():'')}</div></div>`});
const left=T.k-d.k,fr=Math.min(1,d.k/T.k),msg=!d.l.length?'Belum ada catatan. Yuk scan makanan pertamamu!':left<0?'Target kalori hari ini terlewati. Tidak apa-apa, besok mulai lagi!':`Sisa ${fm(left)} kkal. ${left>250?'Masih muat camilan sehat!':'Hampir pas, mantap!'}`;
const mc=i=>{const x=M[i%6];return `<div class="m"><div class="tg">${x.m}</div><div style="font-size:15px;line-height:1.2">${x.n}</div><div class="sub">${x.k} kkal · P ${x.p} g</div><button class="bt" data-a="addm" data-i="${i%6}">+ Catat</button></div>`};
return `<div class="hd"><div><h1>Halo, ${esc(S.u.n||'semangat')}!</h1><div class="sub">${DN[n.getDay()]}, ${n.getDate()} ${MN[n.getMonth()]}</div></div>${AV(48)}</div>
<div class="c"><div class="rw"><div class="ic" style="width:52px;height:52px;background:#FF8A1F">${FL}</div><div><div class="t" style="font-size:22px">${st} hari beruntun</div><div class="sub">${st?'Catat makan hari ini biar apinya nyala':'Catat makanan hari ini untuk mulai streak'}</div></div></div><div style="display:flex;justify-content:space-between">${wk}</div></div>
<div class="c rw" style="flex-direction:row;gap:14px"><div style="position:relative;width:120px;height:120px;flex:none"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Kalori ${fm(d.k)} dari ${fm(T.k)}"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--soft)" stroke-width="14"/><circle cx="60" cy="60" r="50" fill="none" stroke="#FF6B57" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(fr*314.16).toFixed(1)} 314.16" transform="rotate(-90 60 60)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="t" style="font-size:26px;line-height:1">${fm(d.k)}</div><div class="sub" style="font-size:11px">dari ${fm(T.k)} kkal</div></div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="background:var(--bg);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.3">${msg}</div>${AV(40)}</div></div>
<div class="c" style="gap:12px">${bars(d)}</div>
<div class="c"><h2>Catatan hari ini</h2>${list(d.l)}<button class="btn" data-a="nav" data-v="man">+ Tambah manual</button>${!S.e.length?'<button class="btn" data-a="seed">Isi data contoh (12 hari)</button>':''}</div>
<div class="rw" style="justify-content:space-between"><h2>Saran menu hari ini</h2><button class="lk" data-a="sg">Ganti</button></div>
<div style="display:flex;gap:12px;margin-top:-12px">${mc(sg)}${mc(sg+1)}</div>`}
function scan(){return `<div class="hd l"><button class="ic" data-a="nav" data-v="home" aria-label="Kembali">${BK}</button><h1>Scan makanan</h1></div>
<div class="ph">${sc.img?`<img src="${sc.img}" alt="Foto makanan">`:PL+'<span>Ambil atau pilih foto makananmu</span>'}</div>
<label class="btn pri" for="fi">Ambil / pilih foto</label><input id="fi" type="file" accept="image/*" capture="environment" hidden>
<button class="btn dk" data-a="an">${sc.busy?'Menganalisis…':'Analisis foto'}</button>
<button class="lk" data-a="demo">Pakai foto contoh</button>
<button class="lk" data-a="nav" data-v="man">Isi manual (tanpa AI)</button>
<p class="nt">Hasil AI hanyalah perkiraan. Koreksi porsi kalau perlu.</p>`}
function res(){const it=sc.it.map(nu),T=it.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
return `<div class="hd l"><button class="ic" data-a="again" aria-label="Kembali">${BK}</button><h1>Hasil scan</h1></div>
<div class="ph" style="height:150px">${sc.img?`<img src="${sc.img}" alt="Foto makanan">`:PL}</div>
<div class="sub" style="text-align:center">AI mengenali ${it.length} makanan${sc.mock?' (hasil contoh)':sc.cf?' (AI cadangan, perkiraan lebih kasar)':''}</div>
<div class="c">${it.map((x,i)=>`<div class="rw er"><div style="flex:1"><div>${x.n}</div><div class="rw" style="gap:6px"><button class="ic" data-a="gm" data-i="${i}" data-d="-10" aria-label="Kurangi porsi ${x.n}">−</button><b>${sc.it[i].g} g</b><button class="ic" data-a="gm" data-i="${i}" data-d="10" aria-label="Tambah porsi ${x.n}">+</button></div></div><b class="t" style="font-size:18px">${fm(x.k)} kkal</b></div>`).join('')}</div>
<div class="c dk"><div class="sub" style="color:inherit;opacity:.8">Total perkiraan</div><div class="t" style="font-size:34px;line-height:1.1">${fm(T.k)} kkal</div><div class="sub" style="color:inherit;opacity:.8">kisaran ${fm(T.k*.9)}–${fm(T.k*1.1)} kkal</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="mc">P ${fm(T.p)} g</span><span class="mc">K ${fm(T.c)} g</span><span class="mc">L ${fm(T.f)} g</span></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">${['Pagi','Siang','Malam','Camilan'].map(x=>`<button class="ch${sc.meal===x?' on':''}" data-a="meal" data-m="${x}">${x}</button>`).join('')}</div>
<button class="btn pri" data-a="sv">Simpan ke hari ini</button><button class="lk" data-a="again">Foto ulang</button>`}
function calv(){const T=S.t,t=today(),{y,m}=cs,off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();let g='';
for(let i=1;i<=nd;i++){const k=dk(new Date(y,m,i)),d=day(k),r=d.k/T.k;let c=!d.l.length||k>t?'f':(r>=.8&&r<=1.05?'g':'y');if(k===t)c+=' tn';if(k===cs.sel)c+=' sl';g+=`<button class="k ${c}"${i===1?` style="grid-column-start:${off+1}"`:''} data-a="sel" data-d="${k}" aria-label="${i} ${MN[m]}">${i}</button>`}
const sd=day(cs.sel),p=parse(cs.sel);
return `<div class="hd"><h1>Kalender</h1><div class="rw" style="background:#FF8A1F;color:var(--on);border-radius:16px;padding:6px 12px;gap:6px">${FL.replace('28','18')}<b>${streak()} hari</b></div></div>
<div class="c"><div class="rw" style="justify-content:space-between"><button class="ic" data-a="cm" data-d="-1" aria-label="Bulan sebelumnya">${BK}</button><div class="t" style="font-size:20px">${MN[m]} ${y}</div><button class="ic" data-a="cm" data-d="1" aria-label="Bulan berikutnya">${NX}</button></div>
<div class="wk"><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span></div><div class="gr">${g}</div>
<div class="lg"><span><i style="background:var(--gf)"></i>Dalam target</span><span><i style="background:var(--yf)"></i>Di luar target</span><span><i style="background:var(--soft)"></i>Belum dicatat</span></div></div>
<div class="c" style="gap:12px"><div><h2>${DN[p.getDay()]}, ${p.getDate()} ${MN[p.getMonth()]}</h2><div class="sub">Ringkasan hari ini</div></div>${bars(sd)}${list(sd.l)}</div>`}
function menu(){const left=S.t.k-day(today()).k;
return `<div class="hd"><div><h1>Saran menu</h1><div class="sub">${left>0?'Sisa '+fm(left)+' kkal hari ini':'Target kalori hari ini sudah terpenuhi'}</div></div>${AV(48)}</div>`+M.map((x,i)=>`<div class="c"><div class="tg">${x.m}</div><div style="font-size:17px">${x.n}</div><div class="sub">${x.k} kkal · P ${x.p} g · K ${x.c} g · L ${x.f} g</div><button class="bt" data-a="addm" data-i="${i}">+ Catat ke hari ini</button></div>`).join('')}
function prof(){const ds=new Set(S.e.map(x=>x.d)),xp=ds.size*10,lv=1+Math.floor(xp/100),b=best(),u=S.u,T=S.t;
const ni=(a,id,l,v,un,mn,mx)=>`<label class="in"><span>${l}</span><input ${a}="${id}" type="number" inputmode="decimal" min="${mn}" max="${mx}" value="${v}"><i>${un}</i></label>`;
return `<div class="hd"><h1>Profil</h1></div>
<div class="c rw" style="flex-direction:row;gap:14px">${AV(72)}<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="tg" style="background:var(--yf)">Level ${lv} · Pemburu Sehat</div><div class="b" style="height:12px"><div style="width:${xp%100}%;background:#7C5CFF"></div></div><div class="sub">${xp%100}/100 XP ke Level ${lv+1}</div></div></div>
<div class="c"><h2>Data kamu</h2><label class="in nm"><span>Nama</span><input data-u="n" type="text" value="${esc(u.n)}" maxlength="20"></label>${ni('data-u','w','Berat',u.w,'kg',20,300)}${ni('data-u','h','Tinggi',u.h,'cm',80,250)}${ni('data-u','a','Usia',u.a,'tahun',5,120)}</div>
<div class="c"><h2>Target harian</h2>${ni('data-t','k','Kalori',T.k,'kkal',1200,5000)}${ni('data-t','p','Protein',T.p,'g',10,600)}${ni('data-t','c','Karbo',T.c,'g',10,800)}${ni('data-t','f','Lemak',T.f,'g',10,400)}<p class="nt">Target hanya perkiraan umum. Untuk kebutuhan khusus, tanyakan ke ahli gizi.</p></div>
<div class="c"><h2>Lencana</h2><div style="display:flex">${[7,14,30].map(n=>`<div class="bd"><i class="${b>=n?'e':''}">${n}</i>${n} hari</div>`).join('')}</div></div>
<div class="c"><h2>Backup data</h2><textarea id="bk" aria-label="Teks backup" placeholder="Tempel teks backup di sini untuk memulihkan"></textarea><div style="display:flex;gap:8px"><button class="btn dk" style="flex:1" data-a="cp">Salin backup</button><button class="btn" style="flex:1;background:var(--soft)" data-a="rs">Pulihkan</button></div></div>`}
function man(){const ni=(id,l,u,ph)=>`<label class="in"><span>${l}</span><input id="${id}" type="number" inputmode="decimal" min="0" max="5000"${ph?` placeholder="${ph}"`:''}><i>${u}</i></label>`;
return `<div class="hd l"><button class="ic" data-a="nav" data-v="home" aria-label="Kembali">${BK}</button><h1>Tambah manual</h1></div>
<div class="c"><label class="in nm"><span>Nama</span><input id="mn" type="text" maxlength="40" placeholder="Contoh: Nasi goreng"></label>${ni('mk','Kalori','kkal','wajib')}${ni('mg','Porsi','g','opsional')}${ni('mp','Protein','g','opsional')}${ni('mc','Karbo','g','opsional')}${ni('mf','Lemak','g','opsional')}</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">${['Pagi','Siang','Malam','Camilan'].map(x=>`<button class="ch${mn.meal===x?' on':''}" data-a="mmeal" data-m="${x}">${x}</button>`).join('')}</div>
<button class="btn pri" data-a="msv">Simpan ke hari ini</button>`}
function render(){$('#app').innerHTML=({home,scan,res,cal:calv,menu,prof,man})[V]()+(V==='scan'||V==='res'||V==='man'?'':NV(V))}
let tm;const toast=(m,ms=1800)=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),ms)};
const add=(m,n,g,k,p,c,f)=>S.e.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,6),d:today(),m,n,g,k,p,c,f});
function seed(){const t=new Date();for(let i=1;i<=12;i++){const k=dk(new Date(t.getFullYear(),t.getMonth(),t.getDate()-i));for(let j=0;j<3+(i%2);j++){const x=M[(i+j*2)%6];S.e.push({id:k+j,d:k,m:x.m,n:x.n,g:0,k:x.k,p:x.p,c:x.c,f:x.f})}}save()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
if(a==='nav'){V=D.v;if(V==='scan')sc={img:null,busy:false,it:[],meal:sc.meal};if(V==='man')mn={meal:defMeal()}}
else if(a==='sg')sg+=2;
else if(a==='addm'){const x=M[+D.i];add(x.m,x.n,0,x.k,x.p,x.c,x.f);save();toast('Tercatat!')}
else if(a==='del'){S.e=S.e.filter(x=>x.id!==D.id);save()}
else if(a==='seed')seed();
else if(a==='an'||a==='demo'){if(sc.busy)return;if(a==='an'){if(!sc.img){toast('Pilih foto dulu, atau pakai foto contoh');return}analyze();return}
sc.busy=true;render();setTimeout(()=>{sc.it=SC[Math.floor(Math.random()*SC.length)].map(([k,g])=>({n:FD[k][0],g,r:FD[k].slice(1)}));sc.mock=true;sc.cf=false;sc.meal=defMeal();sc.busy=false;V='res';render()},1100);return}
else if(a==='gm'){const it=sc.it[+D.i];it.g=Math.min(1000,Math.max(10,it.g+ +D.d))}
else if(a==='meal')sc.meal=D.m;
else if(a==='sv'){sc.it.map(nu).forEach((x,i)=>add(sc.meal,x.n,sc.it[i].g,Math.round(x.k),+x.p.toFixed(1),+x.c.toFixed(1),+x.f.toFixed(1)));save();V='home';toast('Tersimpan ke hari ini')}
else if(a==='again'){V='scan';sc={img:null,busy:false,it:[],meal:sc.meal}}
else if(a==='cm'){cs.m+=+D.d;if(cs.m<0){cs.m=11;cs.y--}if(cs.m>11){cs.m=0;cs.y++}}
else if(a==='sel')cs.sel=D.d;
else if(a==='mmeal'){mn.meal=D.m;document.querySelectorAll('[data-a=mmeal]').forEach(x=>x.classList.toggle('on',x===b));return}
else if(a==='msv'){const nv=id=>Math.max(0,+$('#'+id).value||0),k=nv('mk');if(!(k>0)){toast('Isi kalori dulu ya');return}
add(mn.meal,($('#mn').value.trim()||'Makanan manual').slice(0,40),Math.round(nv('mg')),Math.round(k),nv('mp'),nv('mc'),nv('mf'));save();V='home';toast('Tersimpan ke hari ini')}
else if(a==='cp'){const j=JSON.stringify(S),ta=$('#bk');ta.value=j;ta.select();try{navigator.clipboard.writeText(j).then(()=>toast('Backup disalin'),()=>toast('Salin manual dari kotak teks'))}catch(x){toast('Salin manual dari kotak teks')}return}
else if(a==='rs'){try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.e))throw 0;S={e:o.e,t:Object.assign(S.t,o.t),u:Object.assign(S.u,o.u)};save();toast('Data dipulihkan')}catch(x){toast('Teks backup tidak valid');return}}
render();window.scrollTo(0,0)});
document.addEventListener('change',e=>{const i=e.target;
if(i.id==='fi'){const fl=i.files[0];if(fl){const r=new FileReader();r.onload=()=>{sc.img=r.result;render()};r.readAsDataURL(fl)}}
else if(i.dataset.u){S.u[i.dataset.u]=i.value;save()}
else if(i.dataset.t){const k=i.dataset.t,r={k:[1200,5000],p:[10,600],c:[10,800],f:[10,400]}[k];let v=Math.round(+i.value)||S.t[k];v=Math.min(r[1],Math.max(r[0],v));S.t[k]=v;i.value=v;save()}});
render();
</script>
</body>
</html>
